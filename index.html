<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="FIT PRO"/>
<title>FIT PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080810;--bg2:#0f0f1a;--bg3:#181828;--bg4:#1f1f30;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.13);
  --accent:#7c6af7;--green:#4ade80;--red:#f87171;--orange:#fb923c;
  --text:#e8e8f0;--muted:#5a5a70;--muted2:#8888a0;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}

/* LAYOUT */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sidebar{width:190px;height:100%;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 10px 16px;gap:2px;flex-shrink:0;overflow-y:auto}
.logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;padding:0 8px 24px;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-btn{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;width:100%;text-align:left;transition:all .15s}
.nav-btn:hover,.nav-btn:active{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:rgba(124,106,247,0.12);color:var(--accent);border-color:rgba(124,106,247,0.25)}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar-bottom{margin-top:auto;padding-top:10px;border-top:1px solid var(--border)}
.main{flex:1;height:100%;overflow-y:auto;padding:22px 20px;-webkit-overflow-scrolling:touch}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:16px;margin-bottom:12px}
.card-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:12px}
.ctrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.page-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px}
.page-sub{color:var(--muted2);font-size:13px;margin-bottom:20px}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}

/* STAT */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:14px}
.stat-num{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;line-height:1.1}
.stat-label{font-size:11px;color:var(--muted2);margin-top:2px}
.stat-delta{font-size:10px;font-weight:700;margin-top:5px;padding:2px 7px;border-radius:20px;display:inline-block}
.dg{background:rgba(74,222,128,.15);color:var(--green)}
.dr{background:rgba(248,113,113,.15);color:var(--red)}
.dp{background:rgba(124,106,247,.15);color:var(--accent)}

/* BADGE */
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center}
.badge-p{background:rgba(124,106,247,.15);color:var(--accent);border:1px solid rgba(124,106,247,.2)}
.badge-g{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.2)}
.badge-o{background:rgba(251,146,60,.15);color:var(--orange);border:1px solid rgba(251,146,60,.2)}

/* PROGRESS */
.prog-track{background:var(--bg4);border-radius:99px;overflow:hidden}
.prog-fill{border-radius:99px;transition:width .5s ease}

/* BUTTONS */
.btn{padding:9px 15px;border-radius:9px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent}
.btn-p{background:var(--accent);color:#fff}
.btn-p:active{background:#8f7fff}
.btn-g{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-x{padding:6px 8px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);color:var(--muted2);cursor:pointer;font-size:13px}

/* INPUT */
.inp{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;width:100%;outline:none;-webkit-appearance:none}
.inp:focus{border-color:var(--accent)}
.inp-group{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.inp-label{font-size:11px;color:var(--muted2);font-weight:600}
.textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;width:100%;outline:none;resize:vertical;min-height:90px;line-height:1.6}
.textarea:focus{border-color:var(--accent)}

/* WEEK STRIP */
.week-strip{display:flex;gap:6px;margin-bottom:12px}
.wday{flex:1;padding:9px 3px;border-radius:10px;text-align:center;border:1px solid var(--border);background:var(--bg2);cursor:pointer}
.wday.today{border-color:var(--accent);background:rgba(124,106,247,.1)}
.wday.has-w{border-color:rgba(124,106,247,.3)}
.wday.has-c{border-color:rgba(74,222,128,.3)}
.wday-name{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase}
.wday-num{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin:2px 0}
.wday-dot{width:5px;height:5px;border-radius:50%;margin:0 auto}

/* PHASE BANNER */
.phase-banner{border-radius:13px;padding:16px;margin-bottom:12px;border:1px solid rgba(124,106,247,.25)}

/* MOTIVATION */
.mot-card{border-radius:13px;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,rgba(124,106,247,.18),rgba(96,165,250,.08));border:1px solid rgba(124,106,247,.28)}
.mot-q{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;line-height:1.4}
.mot-a{font-size:11px;color:var(--muted2);margin-top:5px}

/* EX CARD */
.ex-card{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;background:var(--bg3);-webkit-tap-highlight-color:transparent}
.ex-body{padding:11px 12px;border-top:1px solid var(--border)}
.set-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.set-lbl{font-size:11px;color:var(--muted);width:38px;flex-shrink:0}
.set-chk{width:26px;height:26px;border-radius:6px;border:2px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:12px;-webkit-tap-highlight-color:transparent}
.set-chk.done{background:var(--accent);border-color:var(--accent)}

/* MEAL */
.meal-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)}
.meal-row:last-child{border-bottom:none}
.meal-ic{font-size:18px;flex-shrink:0}
.meal-name{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-mac{font-size:11px;color:var(--muted2)}
.meal-kcal{font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0}

/* CHAT */
.chat-wrap{max-height:200px;overflow-y:auto;margin-bottom:9px;-webkit-overflow-scrolling:touch}
.chat-msg{padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.55;margin-bottom:7px}
.chat-ai{background:var(--bg3);border:1px solid var(--border)}
.chat-user{background:rgba(124,106,247,.12);border:1px solid rgba(124,106,247,.2);margin-left:28px}
.chat-row{display:flex;gap:7px}
.typing-dots{display:flex;gap:3px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:5px}
.cal-dn{text-align:center;font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cal-day.kracht{background:rgba(124,106,247,.15);color:var(--accent)}
.cal-day.cardio{background:rgba(74,222,128,.12);color:var(--green)}
.cal-day.rust{background:var(--bg3);color:var(--muted2)}
.cal-day.vandaag{border-color:var(--orange)!important;color:var(--orange);font-weight:700}
.cal-day.verleden{opacity:.35}
.cal-day.leeg{background:transparent;border:none;cursor:default}

/* GUIDE */
.guide-card{border:1px solid var(--border);border-radius:10px;margin-bottom:7px;overflow:hidden}
.guide-head{display:flex;align-items:center;gap:9px;padding:12px;cursor:pointer;background:var(--bg3);-webkit-tap-highlight-color:transparent}
.guide-body{padding:13px;border-top:1px solid var(--border);font-size:13px;line-height:1.65;color:var(--muted2)}
.guide-body strong{color:var(--text)}
.guide-tip{background:var(--bg3);border-left:3px solid var(--accent);padding:7px 11px;border-radius:0 7px 7px 0;margin-top:9px;font-size:12px;color:var(--muted2)}

/* FOOD TIP */
.ftip{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.ftip:last-child{border-bottom:none}
.ftip-ic{font-size:17px;flex-shrink:0;margin-top:1px}

/* WEIGHT ROW */
.wrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.wrow:last-child{border-bottom:none}

/* PHASE STEP */
.pstep{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.pstep:last-child{border-bottom:none}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);padding:3px;border-radius:9px;margin-bottom:14px}
.tab{flex:1;padding:7px 6px;border:none;border-radius:7px;background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab.active{background:var(--bg2);color:var(--text)}

/* DIVIDER */
.div{height:1px;background:var(--border);margin:11px 0}

@media(max-width:600px){
  .sidebar{width:50px;padding:14px 7px}
  .nav-btn span:not(.nav-icon){display:none}
  .logo{font-size:0;padding-bottom:14px}
  .logo::after{content:"F";font-size:18px;font-family:'Syne',sans-serif;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .main{padding:16px 12px}
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script>
// ── Storage ────────────────────────────────────────────────────────────
const S={
  get(k){try{const r=localStorage.getItem("fp_"+k);return r?JSON.parse(r):null;}catch{return null;}},
  set(k,v){try{localStorage.setItem("fp_"+k,JSON.stringify(v));}catch{}}
};
function load(k,fb){const v=S.get(k);return v!==null?v:fb;}
function save(k,v){S.set(k,v);}

// ── State ──────────────────────────────────────────────────────────────
const state={
  page:"dashboard",
  weightLog:load("weightLog",[]),
  workoutLog:load("workoutLog",{}),
  calorieLog:load("calorieLog",{}),
  notes:load("notes",{}),
  exOpen:{},
  guideOpen:{},
  workoutTab:"A",
  selectedDate:null,
  chatHistory:[{role:"ai",text:"Wat heb je gegeten? Typ het in — ik bereken de calorieën en eiwitten. Bv: '200g kipfilet, 100g rijst en broccoli'"}],
  chatLoading:false,
  calcResult:null,
  notesDate:todayKey(),
};

// ── Date helpers ───────────────────────────────────────────────────────
function todayKey(){return new Date().toISOString().split("T")[0];}
function getStartDate(){
  let s=load("startDate",null);
  if(!s){const d=new Date();const dow=d.getDay()===0?6:d.getDay()-1;d.setDate(d.getDate()-dow);d.setHours(0,0,0,0);s=d.toISOString();save("startDate",s);}
  return new Date(s);
}
function getCurrentWeek(){const now=new Date();const start=getStartDate();const diff=Math.floor((now-start)/(7*24*60*60*1000));return Math.min(Math.max(diff+1,1),26);}
function buildSchedule(){
  const start=getStartDate();const sched={};const pat=["A","C",null,"B",null,"C",null];
  for(let w=0;w<26;w++)for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);sched[dt.toISOString().split("T")[0]]=pat[d];}
  return sched;
}

// ── Data ───────────────────────────────────────────────────────────────
const PHASES=[
  {weeks:[1,4],name:"Fase 1 — Fundament",color:"#60a5fa",desc:"Techniek leren, gewenning. Lichte gewichten, perfecte vorm."},
  {weeks:[5,8],name:"Fase 2 — Opbouw",color:"#7c6af7",desc:"Volume verhogen, gewichten zwaarder."},
  {weeks:[9,13],name:"Fase 3 — Kracht",color:"#a78bfa",desc:"Intensiteit omhoog, nieuwe oefeningen."},
  {weeks:[14,18],name:"Fase 4 — Intensiteit",color:"#f59e0b",desc:"Supersets, hogere gewichten. Vetverbranding maximaliseren."},
  {weeks:[19,22],name:"Fase 5 — Peak",color:"#4ade80",desc:"Piekfase. Zwaarste training tot nu toe."},
  {weeks:[23,26],name:"Fase 6 — Recomposition",color:"#f87171",desc:"Onderhoud & definitie. Vet verder kwijt."},
];
function getPhase(w){return PHASES.find(p=>w>=p.weeks[0]&&w<=p.weeks[1])||PHASES[0];}

const WP={
  1:{
    A:{name:"Kracht A — Borst & Schouders",ex:[
      {name:"Push-ups",sets:3,reps:"8-10",weight:"Lichaamsgewicht",muscles:"Borst, triceps"},
      {name:"Dumbbell Shoulder Press",sets:3,reps:"10",weight:"8-10 kg",muscles:"Schouders"},

      {name:"Bicep Curls",sets:3,reps:"12",weight:"8 kg",muscles:"Biceps"},
      {name:"Goblet Squat",sets:3,reps:"10",weight:"10-12 kg",muscles:"Benen, billen"},
      {name:"Romanian Deadlift",sets:3,reps:"10",weight:"12-14 kg",muscles:"Hamstrings"},

    ]},
    C:{name:"Cardio — Looptraining",ex:[

      {name:"Jog 3min / Wandel 2min",sets:4,reps:"×",weight:"—",muscles:"Cardio"},
      {name:"Cooldown",sets:1,reps:"5 min",weight:"—",muscles:"—"},
    ]}
  },
  2:{
    A:{name:"Kracht A — Borst & Schouders",ex:[
      {name:"Dumbbell Chest Press",sets:4,reps:"10-12",weight:"14-16 kg",muscles:"Borst"},

      {name:"Bulgarian Split Squat",sets:4,reps:"10/been",weight:"14 kg",muscles:"Benen"},
      {name:"Romanian Deadlift",sets:4,reps:"10",weight:"22-24 kg",muscles:"Posterior"},
      {name:"Zijwaartse lunges",sets:3,reps:"10/zijde",weight:"10 kg",muscles:"Binnenbeen"},
      {name:"Dead bug",sets:3,reps:"10/zijde",weight:"—",muscles:"Core"},
    ]},
    C:{name:"Cardio — HIIT",ex:[

      {name:"Sprint 30s / Wandel 90s",sets:8,reps:"×",weight:"—",muscles:"Vetverbranding"},
      {name:"Uitlopen",sets:1,reps:"10 min",weight:"—",muscles:"—"},

  },
  5:{
    A:{name:"Peak A — Hoge Intensiteit",ex:[
      {name:"Dumbbell Chest Press",sets:5,reps:"6-8",weight:"22-24 kg",muscles:"Borst"},

// ── Render helpers ─────────────────────────────────────────────────────
function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class")el.className=v;
    else if(k==="html")el.innerHTML=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v);
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null)return;
      el.appendChild(typeof c==="string"?document.createTextNode(c):c);
    });
  }
  return el;
}
function div(cls,children,attrs){return h("div",{class:cls,...attrs},children);}
function progBar(val,max,height,color){
  const pct=Math.min(100,Math.round((val/max)*100));
  const track=div("prog-track",[]);
  track.style.height=height+"px";
  const fill=div("prog-fill",[]);
  fill.style.width=pct+"%";fill.style.height="100%";fill.style.background=color||"var(--accent)";
  track.appendChild(fill);return track;
}
function statCard(val,unit,label,delta,deltaGood,color){
  const c=div("stat-card",[]);
  const num=div("stat-num",[val+"",h("span",{class:"",style:"font-size:13px;color:var(--muted2)"},unit)]);
  num.querySelector("span").style.fontSize="13px";
  num.querySelector("span").style.color="var(--muted2)";
  num.style.color=color||"var(--accent)";
  c.appendChild(num);
  c.appendChild(div("stat-label",[label]));
  if(delta){const d2=div("stat-delta",[delta]);d2.className="stat-delta "+(deltaGood?"dg":"dr");c.appendChild(d2);}
  return c;
}

async function callAI(prompt,system){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system,messages:[{role:"user",content:prompt}]})
  });
  const d=await r.json();
  return d.content?.map(b=>b.text||"").join("")||"Fout.";
}

    const val=inp.value.trim();if(!val||state.chatLoading)return;
    inp.value="";state.chatHistory.push({role:"user",text:val});state.chatLoading=true;render();

function renderGewicht(){
  const latest=state.weightLog.length>0?state.weightLog[state.weightLog.length-1].kg:98;
  const lost=Math.max(0,98-latest).toFixed(1);
  let feedback=null;
  if(state.weightLog.length>=2){
    const l2=state.weightLog.slice(-2);const diff=l2[1].kg-l2[0].kg;
    if(diff<-1.5)feedback={c:"var(--orange)",t:"Je valt te snel af (>1.5kg/week). Eet iets meer om spiermassa te behouden."};
    else if(diff<0)feedback={c:"var(--green)",t:"Geweldig! Je bent "+Math.abs(diff).toFixed(1)+" kg afgevallen. Keep going!"};
    else if(diff===0)feedback={c:"var(--blue)",t:"Geen verandering. Controleer je calorie-inname."};
    else feedback={c:"var(--red)",t:"+"+diff.toFixed(1)+" kg. Controleer je voeding."};
  }

  const wrap=div("",[]);
  wrap.appendChild(h("div",{class:"page-title"},["Gewicht"]));
  wrap.appendChild(h("div",{class:"page-sub"},["Weeg jezelf wekelijks, 's ochtends voor ontbijt"]));

  wrap.appendChild(div("g3",[
    statCard(latest," kg","Huidig","","",  "var(--text)"),
    statCard(lost," kg","Verloren",parseFloat(lost)>0?"Doorgaan!":null,true,"var(--green)"),
    statCard(Math.max(0,latest-88).toFixed(1)," kg","Tot doel (88kg)",null,false,"var(--accent)"),
  ]));

  if(feedback){const fb=div("card",[feedback.t]);fb.style.cssText="font-size:13px;color:"+feedback.c;wrap.appendChild(fb);}

  // Chart
  if(state.weightLog.length>1){
    const chartCard=div("card",[]);
    chartCard.appendChild(h("div",{class:"card-title"},["Gewichtsverloop"]));
    const canvas=h("canvas",{id:"wChart",style:"width:100%;height:160px"});
    chartCard.appendChild(canvas);wrap.appendChild(chartCard);
    setTimeout(()=>{
      const c=document.getElementById("wChart");if(!c)return;
      const ctx=c.getContext("2d");
      const W=c.offsetWidth;const H=160;c.width=W;c.height=H;
      const data=state.weightLog.slice(-12);
      const vals=data.map(w=>w.kg);
      const minV=Math.min(...vals)-1;const maxV=Math.max(...vals)+1;
      const xStep=W/(data.length-1);
      const yScale=(v)=>H-20-((v-minV)/(maxV-minV))*(H-40);
      ctx.strokeStyle="rgba(255,255,255,0.05)";ctx.lineWidth=1;
      for(let i=0;i<5;i++){const y=20+i*(H-40)/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      ctx.beginPath();ctx.strokeStyle="#7c6af7";ctx.lineWidth=2.5;ctx.lineJoin="round";
      data.forEach((w,i)=>{const x=i*xStep;const y=yScale(w.kg);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
      ctx.stroke();
      ctx.fillStyle="#7c6af7";
      data.forEach((w,i)=>{ctx.beginPath();ctx.arc(i*xStep,yScale(w.kg),4,0,Math.PI*2);ctx.fill();});
      ctx.fillStyle="rgba(255,255,255,0.3)";ctx.font="10px DM Sans,sans-serif";ctx.textAlign="center";
      data.forEach((w,i)=>{if(i%(Math.ceil(data.length/5))===0)ctx.fillText(w.date.slice(5),i*xStep,H-3);});
    },50);
  }

  // Add form
  const addCard=div("card",[]);
  addCard.appendChild(h("div",{class:"card-title"},["Meting toevoegen"]));
  const form=div("",[]);form.style.cssText="display:flex;gap:8px;align-items:flex-end";
  const dg=div("inp-group",[]);dg.style.flex="1";dg.style.marginBottom="0";
  dg.appendChild(h("label",{class:"inp-label"},["Datum"]));
  const di=h("input",{class:"inp",type:"date",value:todayKey()});dg.appendChild(di);
  const kg=div("inp-group",[]);kg.style.flex="1";kg.style.marginBottom="0";
  kg.appendChild(h("label",{class:"inp-label"},["Gewicht (kg)"]));
  const ki=h("input",{class:"inp",type:"number",step:"0.1",placeholder:"bv. 96.5"});kg.appendChild(ki);
  const saveBtn=h("button",{class:"btn btn-p"},["Opslaan"]);
  saveBtn.addEventListener("click",()=>{
    if(!ki.value)return;
    const entry={date:di.value,kg:parseFloat(ki.value)};
    const upd=[...state.weightLog.filter(w=>w.date!==di.value),entry].sort((a,b)=>a.date.localeCompare(b.date));
    state.weightLog=upd;save("weightLog",upd);ki.value="";render();
  });
  form.appendChild(dg);form.appendChild(kg);form.appendChild(saveBtn);
  addCard.appendChild(form);wrap.appendChild(addCard);

  if(state.weightLog.length>0){
    const hist=div("card",[]);hist.appendChild(h("div",{class:"card-title"},["Geschiedenis"]));
    [...state.weightLog].reverse().forEach((w,i,arr)=>{
      const prev=arr[i+1];const diff=prev?(w.kg-prev.kg).toFixed(1):null;
      const row=div("wrow",[]);
      row.appendChild(h("span",{style:"font-size:12px;color:var(--muted2)"},[w.date]));
      row.appendChild(h("span",{style:"font-family:Syne,sans-serif;font-weight:700;font-size:16px"},[w.kg+" kg"]));
      if(diff)row.appendChild(h("span",{style:"font-size:12px;font-weight:600;color:"+(parseFloat(diff)<0?"var(--green)":"var(--red)")},[parseFloat(diff)<0?diff:"+"+diff+" kg"]));
      const del=h("button",{class:"btn-x"},["×"]);del.addEventListener("click",()=>{const u=state.weightLog.filter(x=>x.date!==w.date);state.weightLog=u;save("weightLog",u);render();});
      row.appendChild(del);hist.appendChild(row);
    });
    wrap.appendChild(hist);
  }
  return wrap;
}

    mc.appendChild(hdr);
    const grid=div("cal-grid",[]);
    const firstDow=new Date(month.getFullYear(),month.getMonth(),1).getDay();
    const startDow=firstDow===0?6:firstDow-1;

    resultDiv.appendChild(g2r);

    const bmiColor=bmi<25?"var(--green)":bmi<30?"var(--orange)":"var(--red)";

    const c3=div("card",[]);c3.style.marginBottom="0";c3.appendChild(h("div",{class:"card-title"},["Verlies/week"]));c3.appendChild(h("div",{style:"font-family:Syne,sans-serif;font-size:28px;font-weight:800;color:var(--green)"},[wkly.toFixed(2)]));c3.appendChild(h("div",{style:"font-size:11px;color:var(--muted2)"},["kg per week"]));
    g3r.appendChild(c1);g3r.appendChild(c2);g3r.appendChild(c3);resultDiv.appendChild(g3r);
    const pc=div("card",[]);pc.appendChild(h("div",{class:"card-title"},["Eiwitdoel"]));pc.appendChild(h("div",{style:"font-size:13px;color:var(--muted2);line-height:1.65"},["Op basis van "+vals.weight+"kg: streef naar "]));pc.querySelector("div:last-child").innerHTML="Op basis van "+vals.weight+"kg: streef naar <strong style='color:var(--text)'>"+Math.round(wn*1.6)+"–"+Math.round(wn*1.8)+"g eiwit per dag</strong>.";

// ── Smart offline coach logic ──────────────────────────────────────────
function getBotReply(msg){
  const m=msg.toLowerCase().trim();
  const week=getCurrentWeek();
  const phase=getPhase(week);
  const today=todayKey();
  const latest=state.weightLog.length>0?state.weightLog[state.weightLog.length-1].kg:98;
  const lost=Math.max(0,98-latest).toFixed(1);
  const todayCals=(state.calorieLog[today]||[]).reduce((s,m)=>s+(m.kcal||0),0);
  const todayProt=(state.calorieLog[today]||[]).reduce((s,m)=>s+(m.prot||0),0);
  const customCals=load("customCals",2050);
  const customProt=load("customProt",150);

  // ── Aanpassingen schema ──
  const calMatch=m.match(/calorie[^\d]*(\d{3,4})/);
  if(calMatch){
    const val=parseInt(calMatch[1]);
    if(val>=1200&&val<=3500){save("customCals",val);return{text:"✅ Caloriedoel aangepast naar "+val+" kcal/dag! Dit wordt direct doorgevoerd in je dashboard.",action:"refresh"};}
    return{text:"Dat lijkt me geen realistisch caloriedoel. Kies iets tussen 1200 en 3500 kcal."};
  }
  const protMatch=m.match(/eiwit[^\d]*(\d{2,3})/);
  if(protMatch){
    const val=parseInt(protMatch[1]);
    if(val>=80&&val<=300){save("customProt",val);return{text:"✅ Eiwitdoel aangepast naar "+val+"g/dag!",action:"refresh"};}
    return{text:"Dat lijkt geen realistisch eiwitdoel. Kies iets tussen 80g en 300g."};
  }

  // Gewicht loggen via chat
  const wMatch=m.match(/(\d{2,3}[.,]\d)\s*kg|weeg\s*(\d{2,3})/);
  if(wMatch&&(m.includes("weeg")||m.includes("kg"))){
    const kg=parseFloat((wMatch[1]||wMatch[2]).replace(",","."));
    if(kg>50&&kg<250){
      const entry={date:today,kg};
      const upd=[...state.weightLog.filter(w=>w.date!==today),entry].sort((a,b)=>a.date.localeCompare(b.date));
      state.weightLog=upd;save("weightLog",upd);
      const diff=(kg-98).toFixed(1);
      return{text:"✅ Gewicht "+kg+"kg opgeslagen voor vandaag!\n\nJe bent al "+Math.abs(diff)+"kg "+(parseFloat(diff)<0?"afgevallen 💪":"bijgekomen")+". Nog "+Math.max(0,kg-88).toFixed(1)+"kg te gaan naar je doel van 88kg.",action:"refresh"};
    }
  }

  // ── Voortgang ──
  if(m.includes("voortgang")||m.includes("hoe gaat")||m.includes("progressie")||m.includes("resultaat")){
    const wksLeft=26-week;
    let feedback="";
    if(parseFloat(lost)===0)feedback="Je hebt nog geen gewichtsmetingen ingegeven — voeg ze toe via de Gewicht-pagina!";
    else if(parseFloat(lost)<2)feedback="Je bent net gestart. Hou vol, de eerste resultaten komen eraan!";
    else if(parseFloat(lost)<5)feedback="Goede start! Je bent al "+lost+"kg kwijt. Consistentie is nu het sleutelwoord.";
    else feedback="Wauw, "+lost+"kg verloren! Dat is uitstekend. Je bent goed op weg!";
    return{text:"📊 Jouw voortgang:\n\n• Gewicht: "+latest+"kg (was 98kg)\n• Verloren: "+lost+"kg\n• Nog te gaan: "+Math.max(0,latest-88).toFixed(1)+"kg\n• Fase: "+phase.name+"\n• Week "+week+" van 26 ("+wksLeft+" weken resterend)\n\n"+feedback};
  }

  // ── Motivatie ──
  if(m.includes("motiveer")||m.includes("motivatie")||m.includes("niet meer zin")||m.includes("opgeven")||m.includes("moeilijk")||m.includes("lastig")){
    const msgs=["Je bent al "+lost+"kg kwijt. Dat gedaan-hebben is van jou — niemand kan dat wegnemen. Eén slechte dag maakt je niet dik, één goede dag maakt je niet slank. Gewoon morgen verdergaan. 💪","Kijk even terug naar waar je begon: 98kg, geen routine, geen plan. Nu heb je een 26-weken schema, je logt je voeding en workouts. Dat is al enorm. Hou vol! 🔥","Week "+week+" van 26. Meer dan de helft van de mensen zou al gestopt zijn. Jij niet. Dat zegt alles. 🏆","Het moeilijkste is niet de workout — het is de beslissing om te beginnen. Die beslissing heb jij al genomen. De rest is gewoon uitvoeren. 💪"];
    return{text:msgs[Math.floor(Math.random()*msgs.length)]};
  }

  // ── Vandaag ──
  if(m.includes("vandaag")||m.includes("wat moet ik")){
    const sched=buildSchedule();const todayType=sched[today];
    if(todayType){
      const wo=getWorkout(week,todayType);
      const calsLeft=customCals-todayCals;
      return{text:"📅 Vandaag: "+wo.name+"\n\n"+wo.ex.slice(0,4).map(e=>"• "+e.name+" — "+e.sets+"×"+e.reps+" ("+e.weight+")").join("\n")+"\n\nVoeding: je hebt al "+todayCals+" kcal gegeten. Nog "+Math.max(0,calsLeft)+" kcal over voor vandaag.\n\nKlaar? Ga naar Workouts en vink je sets af! 💪"};
    }else{
      return{text:"☕ Vandaag is een rustdag!\n\nGebruik deze dag voor herstel:\n• Licht wandelen mag\n• Zorg voor voldoende eiwitten ("+customProt+"g)\n• Slaap minstens 7-8 uur\n• Drink 2-3 liter water\n\nJe spieren groeien en herstellen op rustdagen. Niets doen is ook trainen!"};
    }
  }

  // ── Voeding vragen ──
  if(m.includes("eten")||m.includes("voeding")||m.includes("maaltijd")||m.includes("calorie")||m.includes("eiwit")){
    if(m.includes("hoeveel")||m.includes("doel")||m.includes("moet")){
      return{text:"🍽️ Jouw voedingsdoelen:\n\n• Calorieën: "+customCals+" kcal/dag\n• Eiwitten: "+customProt+"g/dag\n\nVandaag al gegeten:\n• "+todayCals+" kcal ("+Math.max(0,customCals-todayCals)+" over)\n• "+todayProt+"g eiwit ("+Math.max(0,customProt-todayProt)+"g nog nodig)\n\nTip: gebruik de Voeding-pagina om maaltijden in te geven — ik bereken dan automatisch calorieën en eiwitten!"};
    }
    if(m.includes("ontbijt")){return{text:"🍳 Goed ontbijt voor jou:\n\n• 4 scrambled eggs + 2 sneden volkorenbrood (~550 kcal, 45g eiwit)\n• Of: 200g Griekse yoghurt + 1 banaan + handje noten (~400 kcal, 25g eiwit)\n• Of: havermout met melk + eiwitpoeder (~450 kcal, 35g eiwit)\n\nDoel: minstens 30g eiwit bij je ontbijt!"};
    }
    if(m.includes("lunch")){return{text:"🥗 Goede lunch opties:\n\n• 200g kipfilet + rijst + groenten (~550 kcal, 50g eiwit)\n• Tonijnsalade met volkoren brood (~450 kcal, 40g eiwit)\n• Omelet (4 eieren) met groenten + brood (~500 kcal, 38g eiwit)\n\nBereid je lunch de avond voor — zo maak je nooit slechte keuzes!"};
    }
    if(m.includes("avond")||m.includes("diner")){return{text:"🍗 Goede avondmaaltijden:\n\n• 200g zalm + zoete aardappel + broccoli (~600 kcal, 45g eiwit)\n• 200g mager gehakt + pasta + tomatensaus (~600 kcal, 42g eiwit)\n• 200g kip + 200g gemengde groenten + rijst (~550 kcal, 48g eiwit)\n\nEet je avondmaal minstens 2 uur voor je gaat slapen."};
    }
    return{text:"🍽️ Voedingstips voor jouw fase ("+phase.name+"):\n\n"+(FOOD_TIPS[week<=4?1:week<=8?2:week<=13?3:week<=18?4:week<=22?5:6].map(t=>t.i+" "+t.t).join("\n"))+"\n\nJe huidige doel: "+customCals+" kcal en "+customProt+"g eiwit per dag. Gebruik de Voeding-pagina om bij te houden wat je eet!"};
  }

  // ── Workout vragen ──
  if(m.includes("workout")||m.includes("training")||m.includes("oefening")||m.includes("kracht")||m.includes("spier")){
    if(m.includes("vandaag")||m.includes("nu")){
      const sched=buildSchedule();const type=sched[today];
      if(!type)return{text:"Vandaag is een rustdag! Geen training gepland. Morgen of overmorgen staat er wel een workout op het schema."};
      const wo=getWorkout(week,type);
      return{text:"💪 Workout van vandaag:\n\n"+wo.name+"\n\n"+wo.ex.map(e=>"• "+e.name+": "+e.sets+" sets × "+e.reps+" | "+e.weight).join("\n")+"\n\nGa naar de Workouts-pagina om je sets bij te houden!"};
    }
    if(m.includes("schema")||m.includes("week")){
      return{text:"📅 Jouw weekschema:\n\n• Maandag: Kracht A (borst & schouders)\n• Dinsdag: Cardio/looptraining\n• Woensdag: Rust 🛌\n• Donderdag: Kracht B (rug & benen)\n• Vrijdag: Rust 🛌\n• Zaterdag: Cardio/looptraining\n• Zondag: Rust 🛌\n\nJe zit nu in "+phase.name+". De oefeningen worden zwaarder naarmate je vordert!"};
    }
    if(m.includes("fase")||m.includes("progressie")||m.includes("zwaarder")){
      return{text:"📈 De 6 fases van jouw programma:\n\n1. Fundament (wk 1-4): techniek leren, lichte gewichten\n2. Opbouw (wk 5-8): meer volume, zwaarder\n3. Kracht (wk 9-13): intensiteit omhoog\n4. Intensiteit (wk 14-18): supersets\n5. Peak (wk 19-22): zwaarste training\n6. Recomposition (wk 23-26): definitie\n\nJij zit nu in: "+phase.name+" (week "+week+")"};
    }
    return{text:"💪 Trainingstips voor nu:\n\n• Je zit in "+phase.name+"\n• "+phase.desc+"\n• Verhoog gewichten zodra 12 reps makkelijk worden\n• Warm altijd 5 min op voor je begint\n• Log je sets in de Workouts-pagina voor progressie\n\nHeb je een specifieke vraag over een oefening?"};
  }

  // ── Oefening techniek ──
  if(m.includes("squat")){return{text:"🦵 Squat techniek:\n\n• Voeten iets breder dan heupbreed, tenen licht naar buiten\n• Zak neer alsof je op een stoel gaat zitten\n• Knieën volgen de richting van je tenen\n• Rug recht houden!\n• Streefdoel: bovenbeen parallel aan de grond\n\n💡 Tip: begin met goblet squat (dumbbell voor borst) — dat helpt je automatisch recht te blijven."};
  }
  if(m.includes("deadlift")||m.includes("rdl")){return{text:"⬇️ Romanian Deadlift techniek:\n\n• Sta rechtop, dumbbells voor dijen\n• Buig voorover met RECHTE RUG — heupen gaan achteruit\n• Laat dumbbells langzaam zakken langs je benen\n• Voel de stretch in je hamstrings\n• Duw heupen vooruit om terug omhoog te komen\n\n⚠️ Meest gemaakte fout: rug ronden. Stop liever te vroeg dan je rug te belasten."};
  }
  if(m.includes("push")||m.includes("pushup")||m.includes("push-up")){return{text:"💪 Push-up techniek:\n\n• Handen iets breder dan schouderbreed\n• Lichaam in één rechte lijn van hoofd tot voeten\n• Buig ellebogen tot borst bijna de grond raakt\n• Core gespannen houden!\n• Duw explosief terug omhoog\n\n💡 Te moeilijk? Begin op je knieën. Te makkelijk? Voeten op een stoel."};
  }
  if(m.includes("row")||m.includes("rug")){return{text:"🏋️ Bent-over Row techniek:\n\n• Gebogen voorover (~45°), rug recht\n• Trek dumbbells naar je heup — ellebogen langs het lichaam\n• Knijp je schouderbladen samen bovenaan\n• Gecontroleerd terug laten zakken\n\n⚠️ Gebruik je rug niet als slinger — de kracht komt uit je rugspieren, niet uit je momentum."};
  }

  // ── Slaap & herstel ──
  if(m.includes("slaap")||m.includes("herstel")||m.includes("rust")||m.includes("pijn")){
    if(m.includes("pijn")||m.includes("spierpijn")){return{text:"🤕 Over spierpijn:\n\n• Spierpijn 24-48u na training = normaal (DOMS)\n• Dit betekent dat je spieren groeien!\n• Licht bewegen (wandelen) helpt bij herstel\n• Scherpe pijn tijdens training = STOP, iets is niet goed\n\nWat voor pijn heb je precies? Geef me meer details als je bezorgd bent."};
    }
    return{text:"😴 Slaap & herstel tips:\n\n• Slaap minstens 7-8 uur per nacht\n• Je spieren groeien TIJDENS slaap, niet tijdens training\n• Rustdagen zijn verplicht — skip ze niet\n• Drink 2-3L water per dag\n• Eet genoeg eiwitten voor spierherstel\n\nSlaap is misschien wel de meest onderschatte factor in afvallen en spierkracht."};
  }

  // ── Gewicht & plateau ──
  if(m.includes("plateau")||m.includes("niet meer")||m.includes("stagneert")){return{text:"📊 Gewichtsplateau — wat doen:\n\n1. Controleer je calorieën opnieuw — na gewichtsverlies daalt je verbruik\n2. Verhoog je cardio met 1 sessie per week\n3. Verminder koolhydraten licht op rustdagen\n4. Check je eiwitinname — minstens "+customProt+"g/dag\n5. Zorg voor goede slaap\n\nEen plateau is normaal na 4-6 weken. Jouw lichaam past zich aan. Kleine aanpassingen zijn genoeg — geen drastische maatregelen!"};
  }

  // ── Gewicht veranderen ──
  if(m.includes("gewicht")||m.includes("weeg")||m.includes("afgevallen")||m.includes("kilo")){
    return{text:"⚖️ Gewichtsinfo:\n\n• Startgewicht: 98kg\n• Huidig: "+latest+"kg\n• Verloren: "+lost+"kg\n• Doel: 88kg (nog "+Math.max(0,latest-88).toFixed(1)+"kg te gaan)\n\nOm je gewicht bij te houden: ga naar de Gewicht-pagina en voeg een meting toe.\nOf typ gewoon '95.5kg' hier en ik sla het op voor je!"};
  }

  // ── Fase info ──
  if(m.includes("fase")||m.includes("schema")||m.includes("programma")){
    return{text:"📅 Je huidige fase:\n\n"+phase.name+" (week "+week+" van 26)\n"+phase.desc+"\n\nNog "+(26-week)+" weken te gaan in het programma. Elke 4-6 weken veranderen de oefeningen en verhoogt de intensiteit automatisch."};
  }

  // ── Aanmoediging algemeen ──
  if(m.includes("goed")||m.includes("super")||m.includes("bedankt")||m.includes("dankjewel")){
    return{text:"Graag gedaan! Blijf zo doorgaan — je bent op de goede weg. 💪\n\nIs er nog iets waar ik je mee kan helpen?"};
  }

  // ── Fallback ──
  return{text:"Goede vraag! Ik kan je helpen met:\n\n💪 Training — schema, oefeningen, techniek\n🍽️ Voeding — maaltijden, calorieën, eiwitten\n📊 Voortgang — gewicht, statistieken\n⚙️ Aanpassingen — caloriedoel, eiwitdoel wijzigen\n\nStel je vraag opnieuw met meer detail, of kies een van de snelknoppen hieronder!"};
}

function renderBot(){
  const existing=document.getElementById("bot-root");
  if(existing)existing.remove();
  const root=document.createElement("div");root.id="bot-root";

  const btn=document.createElement("button");
  btn.className="bot-btn";btn.innerHTML=bot.open?"✕":"🤖";
  if(!bot.open&&bot.unread>0){
    const badge=document.createElement("div");badge.className="bot-badge";
    badge.textContent=bot.unread>9?"9+":bot.unread;btn.appendChild(badge);
  }
  btn.addEventListener("click",()=>{bot.open=!bot.open;if(bot.open)bot.unread=0;renderBot();setTimeout(()=>{const m=document.getElementById("bot-msgs");if(m)m.scrollTop=m.scrollHeight;},50);});
  root.appendChild(btn);

  const panel=document.createElement("div");
  panel.className="bot-panel"+(bot.open?" open":"");

  const header=document.createElement("div");header.className="bot-header";
  header.innerHTML=`<div class="bot-avatar">🤖</div><div><div class="bot-title">FIT PRO Coach</div><div class="bot-sub">● Altijd beschikbaar</div></div>`;
  const closeBtn=document.createElement("button");closeBtn.className="bot-close";closeBtn.textContent="✕";
  closeBtn.addEventListener("click",()=>{bot.open=false;renderBot();});
  header.appendChild(closeBtn);panel.appendChild(header);

  const msgs=document.createElement("div");msgs.className="bot-msgs";msgs.id="bot-msgs";
  bot.msgs.forEach(m=>{
    const el=document.createElement("div");
    el.className="bot-msg "+(m.role==="action"?"action":m.role==="ai"?"ai":"user");
    el.textContent=m.text;msgs.appendChild(el);
  });
  if(bot.loading){
    const typing=document.createElement("div");typing.className="bot-typing";
    for(let i=0;i<3;i++){const d=document.createElement("div");d.className="dot";typing.appendChild(d);}
    msgs.appendChild(typing);
  }
  panel.appendChild(msgs);

  const chips=document.createElement("div");chips.className="bot-chips";
  [["Hoe gaat mijn voortgang?"],["Wat eet ik vandaag?"],["Motiveer me! 🔥"],["Workout van vandaag?"]].forEach(([t])=>{
    const chip=document.createElement("div");chip.className="chip";chip.textContent=t;
    chip.addEventListener("click",()=>sendBotMsg(t));chips.appendChild(chip);
  });
  panel.appendChild(chips);

  const footer=document.createElement("div");footer.className="bot-footer";
  const inp=document.createElement("input");
  inp.className="bot-inp";inp.placeholder="Stel een vraag...";inp.id="bot-inp";
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!bot.loading)sendBotMsg(inp.value);});
  const send=document.createElement("button");send.className="bot-send";send.textContent="↑";
  send.addEventListener("click",()=>sendBotMsg(inp.value));
  footer.appendChild(inp);footer.appendChild(send);panel.appendChild(footer);
  root.appendChild(panel);
  document.body.appendChild(root);
  setTimeout(()=>{const m=document.getElementById("bot-msgs");if(m)m.scrollTop=m.scrollHeight;if(bot.open){const i=document.getElementById("bot-inp");if(i)i.focus();}},50);
}

function sendBotMsg(text){
  if(!text||!text.trim()||bot.loading)return;
  const inp=document.getElementById("bot-inp");if(inp)inp.value="";
  bot.msgs.push({role:"user",text:text.trim()});
  bot.loading=true;renderBot();
  setTimeout(()=>{
    const result=getBotReply(text.trim());
    bot.msgs.push({role:"ai",text:result.text});
    if(result.action==="refresh")render();
    bot.loading=false;bot.unread=bot.open?0:1;
    renderBot();
  },600);
}

renderBot();
</script>
</body>
</html>
