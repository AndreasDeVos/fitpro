<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIT PRO — Jouw 6-Maanden Traject</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080810;--bg2:#0f0f1a;--bg3:#181828;--bg4:#1f1f30;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--accent:#7c6af7;--accent-glow:rgba(124,106,247,0.3);--green:#4ade80;--green-dim:rgba(74,222,128,0.15);--red:#f87171;--red-dim:rgba(248,113,113,0.15);--orange:#fb923c;--orange-dim:rgba(251,146,60,0.15);--blue:#60a5fa;--blue-dim:rgba(96,165,250,0.15);--text:#e8e8f0;--muted:#5a5a70;--muted2:#8888a0;}
html,body,#root{height:100%}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
h1,h2,h3,h4,h5{font-family:'Syne',sans-serif}::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
.app{display:flex;height:100vh;overflow:hidden}.sidebar{width:200px;height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 12px 16px;gap:2px;flex-shrink:0;overflow-y:auto}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;padding:0 8px 28px;background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;transition:all 0.18s;width:100%;text-align:left}
.nav-item:hover{background:var(--bg3);color:var(--text)}.nav-item.active{background:rgba(124,106,247,0.12);color:var(--accent);border-color:rgba(124,106,247,0.25)}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}.sidebar-bottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.main{flex:1;height:100vh;overflow-y:auto;padding:28px 32px}.page-header{margin-bottom:24px}.page-title{font-size:24px;font-weight:800;letter-spacing:-0.5px}.page-sub{color:var(--muted2);font-size:13.5px;margin-top:4px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat-num{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;line-height:1.1}.stat-label{font-size:12px;color:var(--muted2);margin-top:3px}.stat-delta{font-size:11px;font-weight:600;margin-top:6px;padding:2px 8px;border-radius:20px;display:inline-block}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}.badge-purple{background:rgba(124,106,247,0.15);color:var(--accent);border:1px solid rgba(124,106,247,0.2)}.badge-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(74,222,128,0.2)}.badge-red{background:var(--red-dim);color:var(--red)}.badge-orange{background:var(--orange-dim);color:var(--orange)}
.prog-track{background:var(--bg4);border-radius:99px;overflow:hidden}.prog-fill{border-radius:99px;transition:width 0.6s cubic-bezier(.4,0,.2,1)}
.btn{padding:9px 16px;border-radius:9px;border:none;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;transition:all 0.18s;display:inline-flex;align-items:center;gap:6px}.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#8f7fff}.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}.btn-icon{padding:7px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--muted2);cursor:pointer;font-size:14px;transition:all 0.15s}
.input{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:9px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;width:100%;outline:none;transition:border 0.18s}.input:focus{border-color:var(--accent)}.input-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.input-label{font-size:12px;color:var(--muted2);font-weight:600}select.input option{background:var(--bg3)}
.phase-banner{border-radius:14px;padding:18px 20px;margin-bottom:14px;border:1px solid rgba(124,106,247,0.25)}.week-strip{display:flex;gap:8px;margin-bottom:14px}.wday{flex:1;padding:10px 4px;border-radius:11px;text-align:center;border:1px solid var(--border);background:var(--bg2);cursor:pointer}.wday.active-day{border-color:var(--accent);background:rgba(124,106,247,0.1)}.wday.workout-day{border-color:rgba(124,106,247,0.3)}.wday.cardio-day{border-color:rgba(74,222,128,0.3)}.wday-name{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}.wday-num{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;margin:2px 0}.wday-dot{width:5px;height:5px;border-radius:50%;margin:0 auto}
.ex-card{border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden}.ex-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--bg3)}.ex-header:hover{background:var(--bg4)}.ex-body{padding:12px 14px;border-top:1px solid var(--border);background:var(--bg2)}.set-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.set-label{font-size:12px;color:var(--muted);width:42px;flex-shrink:0}.set-done{width:28px;height:28px;border-radius:7px;border:2px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:12px}.set-done.done{background:var(--accent);border-color:var(--accent)}
.meal-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.meal-row:last-child{border-bottom:none}.meal-icon{font-size:20px;flex-shrink:0}.meal-info{flex:1;min-width:0}.meal-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meal-macro{font-size:11.5px;color:var(--muted2)}.meal-kcal{font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0}
.chat-wrap{max-height:220px;overflow-y:auto;padding-right:4px;margin-bottom:10px}.chat-msg{padding:10px 14px;border-radius:11px;font-size:13.5px;line-height:1.55;margin-bottom:8px}.chat-ai{background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:3px}.chat-user{background:rgba(124,106,247,0.12);border:1px solid rgba(124,106,247,0.2);border-bottom-right-radius:3px;margin-left:32px}.chat-input-row{display:flex;gap:8px}
.typing{display:flex;align-items:center;gap:5px;color:var(--muted2);font-size:13px}.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}.cal-day-name{text-align:center;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}.cal-day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid transparent;cursor:pointer;position:relative}.cal-day:hover{border-color:var(--accent)}.cal-day.kracht{background:rgba(124,106,247,0.15);color:var(--accent)}.cal-day.cardio{background:rgba(74,222,128,0.12);color:var(--green)}.cal-day.rust{background:var(--bg3);color:var(--muted2)}.cal-day.today{border-color:var(--orange)!important;color:var(--orange);font-weight:700}.cal-day.past{opacity:.35}.cal-day.empty{background:transparent;border:none;cursor:default}
.guide-card{border:1px solid var(--border);border-radius:11px;margin-bottom:8px;overflow:hidden}.guide-header{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;background:var(--bg3)}.guide-body{padding:14px;border-top:1px solid var(--border);background:var(--bg2);font-size:13.5px;line-height:1.65;color:var(--muted2)}.guide-body strong{color:var(--text)}.guide-tip{background:var(--bg3);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;margin-top:10px;font-size:13px;color:var(--muted2)}
.motivation-card{border-radius:14px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,rgba(124,106,247,0.2),rgba(96,165,250,0.1));border:1px solid rgba(124,106,247,0.3)}.motivation-quote{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;line-height:1.4}.motivation-author{font-size:12px;color:var(--muted2);margin-top:6px}
.tabs{display:flex;gap:3px;background:var(--bg3);padding:3px;border-radius:10px;margin-bottom:16px}.tab{flex:1;padding:7px 10px;border:none;border-radius:8px;background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer}.tab.active{background:var(--bg2);color:var(--text)}
.weight-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}.weight-row:last-child{border-bottom:none}
.phase-step{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}.phase-step:last-child{border-bottom:none}.phase-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.food-tip{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}.food-tip:last-child{border-bottom:none}.food-tip-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.notes-area{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:10px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;width:100%;outline:none;resize:vertical;min-height:80px;line-height:1.6}.notes-area:focus{border-color:var(--accent)}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.sidebar{width:52px;padding:16px 8px}.nav-item span:not(.nav-icon){display:none}.logo{font-size:0;padding-bottom:16px}.logo::after{content:"F";font-size:20px;font-family:'Syne',sans-serif;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.main{padding:20px 16px}}
</style>

<script type="text/babel">
const {useState,useEffect,useRef}=React;
const {LineChart,Line,XAxis,YAxis,Tooltip,ResponsiveContainer,CartesianGrid}=Recharts;
function load(k,fb){try{const r=localStorage.getItem("fitpro_"+k);return r?JSON.parse(r):fb;}catch{return fb;}}
function save(k,v){try{localStorage.setItem("fitpro_"+k,JSON.stringify(v));}catch{}}
function todayKey(){return new Date().toISOString().split("T")[0];}
function getStartDate(){let s=load("startDate",null);if(!s){const d=new Date();const dow=d.getDay()===0?6:d.getDay()-1;d.setDate(d.getDate()-dow);d.setHours(0,0,0,0);s=d.toISOString();save("startDate",s);}return new Date(s);}
function getCurrentWeek(){const now=new Date();const start=getStartDate();const diff=Math.floor((now-start)/(7*24*60*60*1000));return Math.min(Math.max(diff+1,1),26);}
function buildSchedule(){const start=getStartDate();const sched={};const pat=["A","C",null,"B",null,"C",null];for(let w=0;w<26;w++)for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);sched[dt.toISOString().split("T")[0]]=pat[d];}return sched;}

function Dashboard({weightLog,calorieLog,workoutLog}){

  const streak=React.useMemo(()=>{let s=0;const sched2=buildSchedule();const d=new Date();for(let i=0;i<60;i++){const key=new Date(d.getTime()-i*86400000).toISOString().split("T")[0];const plan=sched2[key];if(!plan){if(i>0)s++;continue;}const wl=workoutLog[key+"-"+plan];if(wl&&Object.keys(wl).some(k=>k.startsWith("done-")&&wl[k]))s++;else if(i>0)break;}return s;},[workoutLog]);

    </div>

    <div className="g4"><Stat val={latest} unit=" kg" label="Gewicht" accent="var(--text)"/><Stat val={streak} unit="🔥" label="Streak" delta={streak>=7?"Top!":null} deltaGood={true} accent="var(--orange)"/><Stat val={todayCals} unit=" kcal" label="Calorieën" delta={todayCals>2050?"Over doel":null} deltaGood={false} accent="var(--accent)"/><Stat val={todayProt} unit="g" label="Eiwitten" delta={todayProt>=150?"✓ Doel":null} deltaGood={true} accent="var(--green)"/></div>

function Workouts({workoutLog,setWorkoutLog}){
  const [tab,setTab]=useState("A");const [open,setOpen]=useState({});
  const today=todayKey();const week=getCurrentWeek();const phase=getPhase(week);
  const workout=getWorkout(week,tab);const logKey=today+"-"+tab;const log=workoutLog[logKey]||{};
  const totalSets=workout.exercises.reduce((s,e)=>s+e.sets,0);
  const doneSets=Object.keys(log).filter(k=>k.startsWith("done-")&&log[k]).length;
  function toggleDone(ei,si){const k="done-"+ei+"-"+si;const u={...workoutLog,[logKey]:{...log,[k]:!log[k]}};setWorkoutLog(u);save("workoutLog",u);}
  function setVal(ei,si,field,v){const k=field+"-"+ei+"-"+si;const u={...workoutLog,[logKey]:{...log,[k]:v}};setWorkoutLog(u);save("workoutLog",u);}
  return(<div>
    <div className="page-header"><div className="page-title">Workouts</div><div className="page-sub">Week {week} · {phase.name}</div></div>
    <div className="tabs">{[["A","💪 Kracht A"],["B","💪 Kracht B"],["C","🏃 Cardio"]].map(([t,l])=>(<button key={t} className={"tab"+(tab===t?" active":"")} onClick={()=>setTab(t)}>{l}</button>))}</div>
    <div className="card"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><div><div style={{fontFamily:"Syne",fontSize:18,fontWeight:800}}>{workout.name}</div><div style={{fontSize:12,color:"var(--muted2)",marginTop:2}}>{phase.name}</div></div><div style={{textAlign:"right"}}><div style={{fontFamily:"Syne",fontSize:24,fontWeight:800,color:"var(--accent)"}}>{doneSets}<span style={{fontSize:14,color:"var(--muted)"}}> /{totalSets}</span></div><div style={{fontSize:11,color:"var(--muted)"}}>sets gedaan</div></div></div><ProgBarJSX val={doneSets} max={totalSets} h={8} color="var(--green)"/></div>

      <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}><span style={{fontSize:12,color:"var(--muted2)"}}>{ex.sets}×{ex.reps}</span><span style={{fontSize:12,color:"var(--accent)",fontWeight:600}}>{ex.weight}</span><span style={{color:"var(--muted)",fontSize:12}}>{open[ei]?"▲":"▼"}</span></div>

      {Array.from({length:ex.sets},(_,si)=>{const done=log["done-"+ei+"-"+si];return(<div key={si} className="set-row"><div className="set-label">Set {si+1}</div><input className="input" style={{padding:"6px 9px",fontSize:13}} placeholder={ex.reps} value={log["reps-"+ei+"-"+si]||""} onChange={e=>setVal(ei,si,"reps",e.target.value)}/><input className="input" style={{padding:"6px 9px",fontSize:13}} placeholder={ex.weight} value={log["weight-"+ei+"-"+si]||""} onChange={e=>setVal(ei,si,"weight",e.target.value)}/><div className={"set-done"+(done?" done":"")} onClick={()=>toggleDone(ei,si)}>{done&&<span style={{color:"#fff"}}>✓</span>}</div></div>);})}

  const today=todayKey();const meals=calorieLog[today]||[];
  const [input,setInput]=useState("");const [loading,setLoading]=useState(false);
  const [chat,setChat]=useState([{role:"ai",text:"Wat heb je gegeten? Typ het gewoon in — ik bereken calorieën en eiwitten. Bv: '200g kipfilet, 100g rijst en broccoli'"}]);
  const chatRef=useRef();
  const totalCals=meals.reduce((s,m)=>s+(m.kcal||0),0);const totalProt=meals.reduce((s,m)=>s+(m.prot||0),0);
  const icons=["🍳","🥗","🍗","🥩","🍚","🥜","🍎","🥛","🥦","🧆","🥚","🍠"];
  async function add(){
    if(!input.trim()||loading)return;const msg=input;setInput("");setLoading(true);
    setChat(h=>[...h,{role:"user",text:msg}]);
    try{const reply=await callAI(msg,"Je bent een voedingsassistent. Geef ALLEEN een JSON-array terug, geen uitleg, geen markdown. Formaat: [{"name":"...", "kcal": 000, "prot": 00}]. Gebruik Nederlandse namen.");
      const clean=reply.replace(/```json|```/g,"").trim();const parsed=JSON.parse(clean);
      const newMeals=[...meals,...parsed];const upd={...calorieLog,[today]:newMeals};setCalorieLog(upd);save("calorieLog",upd);
      const k=parsed.reduce((s,m)=>s+m.kcal,0);const p=parsed.reduce((s,m)=>s+m.prot,0);const left=2050-totalCals-k;
      setChat(h=>[...h,{role:"ai",text:"✅ Toegevoegd! ~"+k+" kcal en ~"+p+"g eiwit. "+(left>0?"Nog "+left+" kcal over.":"⚠️ Je zit boven je dagdoel.")}]);
    }catch{setChat(h=>[...h,{role:"ai",text:"Hmm, ik kon dat niet verwerken. Probeer opnieuw met meer detail."}]);}
    setLoading(false);setTimeout(()=>chatRef.current?.scrollTo({top:9999,behavior:"smooth"}),100);
  }
  return(<div>
    <div className="page-header"><div className="page-title">Voeding</div><div className="page-sub">AI berekent calorieën en eiwitten voor jou</div></div>
    <div className="g2">
      <div className="card" style={{textAlign:"center",marginBottom:0}}><div style={{fontFamily:"Syne",fontSize:36,fontWeight:800,color:totalCals>2050?"var(--red)":"var(--accent)"}}>{totalCals}</div><div style={{fontSize:12,color:"var(--muted2)"}}>kcal vandaag</div><ProgBarJSX val={totalCals} max={2050} h={8} color={totalCals>2050?"var(--red)":"var(--accent)"}/><div style={{fontSize:12,color:"var(--muted2)",marginTop:4}}>{Math.max(0,2050-totalCals)} kcal resterend</div></div>
      <div className="card" style={{textAlign:"center",marginBottom:0}}><div style={{fontFamily:"Syne",fontSize:36,fontWeight:800,color:"var(--green)"}}>{totalProt}<span style={{fontSize:18}}>g</span></div><div style={{fontSize:12,color:"var(--muted2)"}}>eiwit vandaag</div><ProgBarJSX val={totalProt} max={150} h={8} color="var(--green)"/><div style={{fontSize:12,color:"var(--muted2)",marginTop:4}}>{Math.max(0,150-totalProt)}g nog nodig</div></div>
    </div>
    <div className="card"><div className="card-title">AI Voedingslogger</div>
      <div className="chat-wrap" ref={chatRef}>{chat.map((m,i)=><div key={i} className={"chat-msg "+(m.role==="ai"?"chat-ai":"chat-user")}>{m.text}</div>)}{loading&&<div className="chat-msg chat-ai typing">Berekenen <div style={{display:"flex",gap:3}}><div className="dot"/><div className="dot"/><div className="dot"/></div></div>}</div>
      <div className="chat-input-row"><input className="input" placeholder="Wat heb je gegeten?" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/><button className="btn btn-primary" onClick={add}>+</button></div>
    </div>
    {meals.length>0&&(<div className="card"><div className="card-title-row"><div className="card-title" style={{margin:0}}>Vandaag gegeten</div><button className="btn btn-ghost btn-sm" onClick={()=>{const u={...calorieLog,[today]:[]};setCalorieLog(u);save("calorieLog",u);}}>Wis alles</button></div>{meals.map((m,i)=>(<div key={i} className="meal-row"><div className="meal-icon">{icons[i%icons.length]}</div><div className="meal-info"><div className="meal-name">{m.name}</div><div className="meal-macro">{m.prot}g eiwit</div></div><div className="meal-kcal">{m.kcal} kcal</div><button className="btn-icon btn-sm" style={{marginLeft:6}} onClick={()=>{const u={...calorieLog,[today]:meals.filter((_,j)=>j!==i)};setCalorieLog(u);save("calorieLog",u);}}>×</button></div>))}</div>)}
  </div>);}

function Gewicht({weightLog,setWeightLog}){
  const [kg,setKg]=useState("");const [date,setDate]=useState(todayKey());
  function addW(){if(!kg)return;const entry={date,kg:parseFloat(kg)};const upd=[...weightLog.filter(w=>w.date!==date),entry].sort((a,b)=>a.date.localeCompare(b.date));setWeightLog(upd);save("weightLog",upd);setKg("");}
  const chart=weightLog.map(w=>({date:w.date.slice(5),kg:w.kg}));
  const latest=weightLog.length>0?weightLog[weightLog.length-1].kg:98;
  const lost=Math.max(0,98-latest).toFixed(1);
  let feedback=null;
  if(weightLog.length>=2){const last2=weightLog.slice(-2);const diff=last2[1].kg-last2[0].kg;if(diff<-1.5)feedback={type:"orange",msg:"Je valt te snel af (>1.5kg/week). Eet iets meer om spiermassa te behouden."};else if(diff<0)feedback={type:"green",msg:"Geweldig! Je bent "+Math.abs(diff).toFixed(1)+" kg afgevallen. Keep going!"};else if(diff===0)feedback={type:"blue",msg:"Geen verandering. Controleer je calorie-inname of verhoog je training."};else feedback={type:"red",msg:"+"+diff.toFixed(1)+" kg. Controleer je voeding — waarschijnlijk boven je caloriedoel gegaan."};}
  return(<div>
    <div className="page-header"><div className="page-title">Gewicht</div><div className="page-sub">Weeg jezelf wekelijks, 's ochtends voor ontbijt</div></div>
    <div className="g3"><Stat val={latest} unit=" kg" label="Huidig" accent="var(--text)"/><Stat val={lost} unit=" kg" label="Verloren" delta={parseFloat(lost)>0?"Doorgaan!":null} deltaGood={true} accent="var(--green)"/><Stat val={Math.max(0,latest-88).toFixed(1)} unit=" kg" label="Tot doel (88kg)" accent="var(--accent)"/></div>
    {feedback&&<div className={"card badge-"+feedback.type} style={{fontSize:13.5}}>💬 {feedback.msg}</div>}
    {chart.length>1&&(<div className="card"><div className="card-title">Gewichtsverloop</div><ResponsiveContainer width="100%" height={180}><LineChart data={chart}><CartesianGrid stroke="rgba(255,255,255,0.04)"/><XAxis dataKey="date" stroke="var(--muted)" tick={{fontSize:10,fill:"var(--muted)"}}/><YAxis stroke="var(--muted)" tick={{fontSize:10,fill:"var(--muted)"}} domain={["auto","auto"]}/><Tooltip contentStyle={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,fontSize:12}}/><Line type="monotone" dataKey="kg" stroke="var(--accent)" strokeWidth={2.5} dot={{fill:"var(--accent)",r:4,strokeWidth:0}}/></LineChart></ResponsiveContainer></div>)}
    <div className="card"><div className="card-title">Meting toevoegen</div><div style={{display:"flex",gap:10,alignItems:"flex-end"}}><div className="input-group" style={{flex:1,marginBottom:0}}><label className="input-label">Datum</label><input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div><div className="input-group" style={{flex:1,marginBottom:0}}><label className="input-label">Gewicht (kg)</label><input className="input" type="number" step="0.1" placeholder="bv. 96.5" value={kg} onChange={e=>setKg(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addW()}/></div><button className="btn btn-primary" onClick={addW}>Opslaan</button></div></div>
    {weightLog.length>0&&(<div className="card"><div className="card-title">Geschiedenis</div>{[...weightLog].reverse().map((w,i,arr)=>{const prev=arr[i+1];const diff=prev?(w.kg-prev.kg).toFixed(1):null;return(<div key={i} className="weight-row"><div style={{fontSize:13,color:"var(--muted2)"}}>{w.date}</div><div style={{fontFamily:"Syne",fontWeight:700,fontSize:17}}>{w.kg} kg</div>{diff&&<div style={{fontSize:13,fontWeight:600,color:parseFloat(diff)<0?"var(--green)":"var(--red)"}}>{parseFloat(diff)<0?diff:"+"+diff} kg</div>}<button className="btn-icon btn-sm" onClick={()=>{const u=weightLog.filter(x=>x.date!==w.date);setWeightLog(u);save("weightLog",u);}}>×</button></div>);})}</div>)}
  </div>);}

function Notities(){
  const today=todayKey();const [notes,setNotes]=useState(()=>load("notes",{}));const [date,setDate]=useState(today);
  const text=notes[date]||"";
  function update(v){const u={...notes,[date]:v};setNotes(u);save("notes",u);}
  const entries=Object.keys(notes).filter(k=>notes[k]).sort((a,b)=>b.localeCompare(a));
  return(<div>
    <div className="page-header"><div className="page-title">Notities</div><div className="page-sub">Dagboek, gevoel, opmerkingen per dag</div></div>
    <div className="card"><div className="card-title-row"><div className="card-title" style={{margin:0}}>Notitie voor</div><input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:"auto",padding:"5px 10px",fontSize:13}}/></div><textarea className="notes-area" placeholder="Hoe voelde de workout? Hoe was je energie? Iets bijzonders vandaag?..." value={text} onChange={e=>update(e.target.value)}/><div style={{fontSize:12,color:"var(--muted)",marginTop:6}}>Automatisch opgeslagen in je browser</div></div>
    {entries.length>0&&(<div className="card"><div className="card-title">Vorige notities</div>{entries.slice(0,10).map(k=>(<div key={k} style={{padding:"10px 0",borderBottom:"1px solid var(--border)",cursor:"pointer"}} onClick={()=>setDate(k)}><div style={{fontSize:12,color:"var(--muted2)",marginBottom:3}}>{k}</div><div style={{fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{notes[k]}</div></div>))}</div>)}
  </div>);}

function Planning(){
  const sched=buildSchedule();const today=todayKey();const week=getCurrentWeek();
  const [selected,setSelected]=useState(today);
  const months=Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i);return new Date(d);});
  const selWeekNum=Math.max(1,Math.min(26,Math.ceil((new Date(selected)-getStartDate())/(7*24*60*60*1000))));
  const selType=sched[selected];const selWorkout=selType?getWorkout(selWeekNum,selType):null;
  return(<div>
    <div className="page-header"><div className="page-title">Planning</div><div className="page-sub">26-weken progressief schema</div></div>
    <div className="card"><div className="card-title">Faseoverzicht</div>{PHASES.map((p,i)=>(<div key={i} className="phase-step"><div className="phase-dot" style={{background:p.color,boxShadow:"0 0 8px "+p.color+"66"}}/><div style={{flex:1}}><div style={{fontSize:13.5,fontWeight:600,color:week>=p.weeks[0]&&week<=p.weeks[1]?p.color:"var(--text)"}}>{p.name}</div><div style={{fontSize:12,color:"var(--muted2)"}}>Week {p.weeks[0]}–{p.weeks[1]}</div></div>{week>=p.weeks[0]&&week<=p.weeks[1]&&<div className="badge badge-purple">Nu bezig</div>}{week>p.weeks[1]&&<div className="badge badge-green">✓ Voltooid</div>}</div>))}</div>
    <div style={{display:"flex",gap:14,marginBottom:12,flexWrap:"wrap"}}>{[{c:"var(--accent)",l:"Kracht"},{c:"var(--green)",l:"Cardio"},{c:"var(--orange)",l:"Vandaag"},{c:"var(--muted)",l:"Rust"}].map(x=>(<div key={x.l} style={{display:"flex",alignItems:"center",gap:5,fontSize:12}}><div style={{width:9,height:9,borderRadius:3,background:x.c}}/><span style={{color:"var(--muted2)"}}>{x.l}</span></div>))}</div>
    {months.map((month,mi)=>{const firstDow=new Date(month.getFullYear(),month.getMonth(),1).getDay();const startDow=firstDow===0?6:firstDow-1;const lastDate=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();const cells=[];for(let i=0;i<startDow;i++)cells.push(null);for(let d=1;d<=lastDate;d++)cells.push(d);return(<div key={mi} className="card"><div className="card-title">{MONTH_NL[month.getMonth()]} {month.getFullYear()}</div><div className="cal-header">{DAY_NL.map(d=><div key={d} className="cal-day-name">{d}</div>)}</div><div className="cal-grid">{cells.map((d,i)=>{if(!d)return <div key={i} className="cal-day empty"/>;const ds=month.getFullYear()+"-"+String(month.getMonth()+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");const plan=sched[ds];const isToday=ds===today;const isPast=ds<today;return(<div key={i} className={"cal-day "+(plan==="C"?"cardio":plan?"kracht":"rust")+(isToday?" today":"")+(isPast&&!isToday?" past":"")} onClick={()=>setSelected(ds)}>{d}</div>);})}</div></div>);})}
    {selected&&(<div className="card" style={{borderColor:"var(--accent)44",background:"rgba(124,106,247,0.05)"}}><div className="card-title">{selected}</div>{selWorkout?(<><div style={{fontFamily:"Syne",fontSize:17,fontWeight:800,marginBottom:4}}>{selWorkout.name}</div><div style={{fontSize:12,color:"var(--muted2)",marginBottom:12}}>Week {selWeekNum} · {getPhase(selWeekNum).name}</div>{selWorkout.exercises.map((ex,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid var(--border)",fontSize:13}}><div><div>{ex.name}</div><div style={{fontSize:11,color:"var(--muted2)"}}>{ex.muscles}</div></div><div style={{textAlign:"right",flexShrink:0,marginLeft:12}}><div style={{color:"var(--muted2)"}}>{ex.sets}×{ex.reps}</div><div style={{fontSize:11,color:"var(--accent)",fontWeight:600}}>{ex.weight}</div></div></div>))}</>):(<div style={{color:"var(--muted2)",fontSize:14}}>🛌 Rustdag — herstel is even belangrijk als training.</div>)}</div>)}
  </div>);}

function Gids(){
  const [open,setOpen]=useState({});const week=getCurrentWeek();
  const tips=FOOD_TIPS[week<=4?1:week<=8?2:week<=13?3:week<=18?4:week<=22?5:6];const phase=getPhase(week);
  return(<div>
    <div className="page-header"><div className="page-title">Beginnersgids</div><div className="page-sub">Oefening uitleg, voedingstips & tips</div></div>
    <div className="card"><div className="card-title">Voedingstips — {phase.name}</div>{tips.map((t,i)=>(<div key={i} className="food-tip"><div className="food-tip-icon">{t.icon}</div><div>{t.tip}</div></div>))}</div>
    <div style={{fontFamily:"Syne",fontWeight:700,fontSize:15,marginBottom:10,color:"var(--muted2)"}}>Oefeningen uitgelegd</div>
    {EXERCISE_GUIDE.map((ex,i)=>(<div key={i} className="guide-card"><div className="guide-header" onClick={()=>setOpen(o=>({...o,[i]:!o[i]}))}>
      <div style={{fontSize:22}}>{ex.icon}</div><div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{ex.name}</div><div style={{fontSize:12,color:"var(--muted2)"}}>{ex.muscles}</div></div>
      <div style={{color:"var(--muted)",fontSize:13}}>{open[i]?"▲":"▼"}</div>
    </div>{open[i]&&(<div className="guide-body"><div dangerouslySetInnerHTML={{__html:ex.desc}}/><div className="guide-tip">💡 {ex.tip}</div></div>)}</div>))}
    <div className="card" style={{marginTop:14}}><div className="card-title">Algemene tips</div>{[{icon:"😴",tip:"Slaap 7-8 uur per nacht. Spierherstel en vetverbranding happen tijdens slaap."},{icon:"📈",tip:"Progressieve overload: verhoog elke 1-2 weken je gewicht of reps."},{icon:"🧘",tip:"Warm altijd op voor training: 5 min stappen, armcirkels."},{icon:"📸",tip:"Maak elke 4 weken een voortgangsfoto."},{icon:"🗓️",tip:"Consistentie > perfectie. 80% volhouden over 6 maanden wint."},{icon:"🤕",tip:"Spierpijn na training = normaal. Scherpe pijn = stop en rust."}].map((t,i)=>(<div key={i} className="food-tip"><div className="food-tip-icon">{t.icon}</div><div>{t.tip}</div></div>))}</div>
  </div>);}

function Calculator(){
  const [age,setAge]=useState("20");const [h,setH]=useState("185");const [w,setW]=useState("98");
  const [act,setAct]=useState("1.55");const [goal,setGoal]=useState("-500");const [result,setResult]=useState(null);
  function calc(){const wn=parseFloat(w),hn=parseFloat(h),an=parseInt(age);const bmr=10*wn+6.25*hn-5*an+5;const tdee=bmr*parseFloat(act);const target=tdee+parseInt(goal);const bmi=wn/Math.pow(hn/100,2);const wkly=Math.abs(parseInt(goal))*7/7700;setResult({bmr:Math.round(bmr),tdee:Math.round(tdee),target:Math.round(target),bmi:bmi.toFixed(1),wkly:wkly.toFixed(2)});}
  return(<div>
    <div className="page-header"><div className="page-title">Calculator</div><div className="page-sub">Bereken je persoonlijk caloriedoel</div></div>
    <div className="card">
      <div className="g2"><div className="input-group"><label className="input-label">Leeftijd</label><input className="input" type="number" value={age} onChange={e=>setAge(e.target.value)}/></div><div className="input-group"><label className="input-label">Lengte (cm)</label><input className="input" type="number" value={h} onChange={e=>setH(e.target.value)}/></div><div className="input-group"><label className="input-label">Gewicht (kg)</label><input className="input" type="number" value={w} onChange={e=>setW(e.target.value)}/></div></div>
      <div className="input-group"><label className="input-label">Activiteitsniveau</label><select className="input" value={act} onChange={e=>setAct(e.target.value)}><option value="1.2">Sedentair</option><option value="1.375">Licht actief (1-3x/week)</option><option value="1.55">Matig actief (3-5x/week)</option><option value="1.725">Zeer actief (6-7x/week)</option></select></div>
      <div className="input-group"><label className="input-label">Doel</label><select className="input" value={goal} onChange={e=>setGoal(e.target.value)}><option value="-750">Snel afvallen (−750 kcal/dag)</option><option value="-500">Geleidelijk afvallen (−500 kcal/dag)</option><option value="-250">Licht tekort (−250 kcal/dag)</option><option value="0">Gewicht behouden</option><option value="300">Spieren opbouwen (+300 kcal/dag)</option></select></div>
      <button className="btn btn-primary" style={{width:"100%"}} onClick={calc}>Bereken</button>
    </div>
    {result&&(<><div className="g2"><Stat val={result.bmr} unit=" kcal" label="Basismetabolisme (BMR)" accent="var(--muted2)"/><Stat val={result.tdee} unit=" kcal" label="Dagverbruik (TDEE)" accent="var(--text)"/></div><div className="g3"><div className="card" style={{marginBottom:0,borderColor:"var(--accent)44",background:"rgba(124,106,247,0.08)"}}><div className="card-title">Caloriedoel</div><div style={{fontFamily:"Syne",fontSize:32,fontWeight:800,color:"var(--accent)"}}>{result.target}</div><div style={{fontSize:12,color:"var(--muted2)"}}>kcal per dag</div></div><div className="card" style={{marginBottom:0}}><div className="card-title">BMI</div><div style={{fontFamily:"Syne",fontSize:32,fontWeight:800,color:parseFloat(result.bmi)<25?"var(--green)":parseFloat(result.bmi)<30?"var(--orange)":"var(--red)"}}>{result.bmi}</div><div style={{fontSize:12,color:"var(--muted2)"}}>{parseFloat(result.bmi)<25?"Gezond":parseFloat(result.bmi)<30?"Licht overgewicht":"Overgewicht"}</div></div><div className="card" style={{marginBottom:0}}><div className="card-title">Verlies/week</div><div style={{fontFamily:"Syne",fontSize:32,fontWeight:800,color:"var(--green)"}}>{result.wkly}</div><div style={{fontSize:12,color:"var(--muted2)"}}>kg verwacht</div></div></div><div className="card"><div className="card-title">Eiwitdoel</div><div style={{fontSize:13.5,color:"var(--muted2)",lineHeight:1.7}}>Op basis van {w}kg: streef naar <strong style={{color:"var(--text)"}}>{Math.round(parseFloat(w)*1.6)}–{Math.round(parseFloat(w)*1.8)}g eiwit per dag</strong>.</div></div></>)}
  </div>);}

function App(){
  const [page,setPage]=useState("dashboard");
  const [weightLog,setWeightLog]=useState(()=>load("weightLog",[]));
  const [workoutLog,setWorkoutLog]=useState(()=>load("workoutLog",{}));
  const [calorieLog,setCalorieLog]=useState(()=>load("calorieLog",{}));
  const week=getCurrentWeek();
  const nav=[{id:"dashboard",icon:"⚡",label:"Dashboard"},{id:"workouts",icon:"💪",label:"Workouts"},{id:"voeding",icon:"🍽️",label:"Voeding"},{id:"gewicht",icon:"📊",label:"Gewicht"},{id:"planning",icon:"📅",label:"Planning"},{id:"notities",icon:"📝",label:"Notities"},{id:"gids",icon:"📖",label:"Gids"},{id:"calc",icon:"🧮",label:"Calculator"}];
  return(<div className="app">
    <nav className="sidebar">
      <div className="logo">FIT PRO</div>
      {nav.map(n=>(<button key={n.id} className={"nav-item"+(page===n.id?" active":"")} onClick={()=>setPage(n.id)}><span className="nav-icon">{n.icon}</span><span>{n.label}</span></button>))}
      <div className="sidebar-bottom"><div style={{fontSize:11,color:"var(--muted)",textAlign:"center",paddingBottom:4}}>Week {week} van 26</div><ProgBarJSX val={week} max={26} h={4} color="var(--accent)"/></div>
    </nav>
    <main className="main">
      {page==="dashboard"&&<Dashboard weightLog={weightLog} calorieLog={calorieLog} workoutLog={workoutLog}/>}
      {page==="workouts"&&<Workouts workoutLog={workoutLog} setWorkoutLog={setWorkoutLog}/>}
      {page==="voeding"&&<Voeding calorieLog={calorieLog} setCalorieLog={setCalorieLog}/>}
      {page==="gewicht"&&<Gewicht weightLog={weightLog} setWeightLog={setWeightLog}/>}
      {page==="planning"&&<Planning/>}
      {page==="notities"&&<Notities/>}
      {page==="gids"&&<Gids/>}
      {page==="calc"&&<Calculator/>}
    </main>
  </div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
